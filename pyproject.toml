[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mac-sysmon-py"
version = "0.1.0"
description = "macOS System Resource & Process Monitor in Python"
readme = "README.md"
authors = [
    { name = "Ashton Mozano" }
]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9.0",
    "psutil>=5.9.0",
    "websockets>=12.0",
]

[project.urls]
Homepage = "https://github.com/mozano/mac-sysmon-py"
